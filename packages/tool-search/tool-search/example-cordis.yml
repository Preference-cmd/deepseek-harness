# Tool Search Plugin Example Configuration
# This configuration enables the tool search functionality

# Tool Search Plugin
- id: tool-search
  name: '@deepseek-ai/dsh-tool-search'
  config:
    # Maximum number of search results to return
    maxResults: 10
    # Minimum similarity threshold (0-1)
    similarityThreshold: 0.3
    # Whether to enable search caching
    cacheEnabled: true
    # Cache TTL in milliseconds (5 minutes)
    cacheTTL: 300000
    # Index refresh interval in milliseconds (1 minute)
    indexRefreshInterval: 60000
    # Maximum concurrent searches
    maxConcurrentSearches: 5

# Example: Adding tool-search to an existing composition
# Add this to your cordis.yml to enable tool search functionality
